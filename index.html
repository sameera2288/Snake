<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Snake – Snack Attack!</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game-root">
    <header class="hud">
      <div class="stat"><span class="label">Score</span><span id="score" class="value">0</span></div>
      <h1 class="title">Snake <span>Snack Attack!</span></h1>
      <div class="stat"><span class="label">Best</span><span id="best" class="value">0</span></div>
    </header>

    <div class="toolbar">
      <span id="run-info" class="run-info">Classic · Normal</span>
      <button id="btn-pause" class="pixel-btn small ghost" type="button">Pause (P)</button>
    </div>

    <div id="board-wrap" class="board-wrap">
      <canvas id="board" aria-label="Snake game board"></canvas>

      <div id="screen-menu" class="overlay">
        <div class="panel">
          <h2 class="panel-title">Snake</h2>
          <p class="panel-sub">Snack Attack!</p>
          <div class="menu-list">
            <button id="btn-play" class="pixel-btn" type="button">Play</button>
            <button id="btn-mode" class="pixel-btn ghost" type="button">Mode: <span id="val-mode"></span></button>
            <button id="btn-theme" class="pixel-btn ghost" type="button">Theme: <span id="val-theme"></span></button>
            <button id="btn-speed" class="pixel-btn ghost" type="button">Speed: <span id="val-speed"></span></button>
            <button id="btn-settings" class="pixel-btn ghost" type="button">Settings</button>
          </div>
          <p class="howto-line">Arrows or WASD to steer. Swipe on mobile. P or Esc pauses.</p>
        </div>
      </div>

      <div id="screen-select" class="overlay hidden">
        <div class="panel">
          <h2 id="select-title" class="panel-title">Mode</h2>
          <div id="select-list" class="menu-list"></div>
          <button id="btn-select-back" class="pixel-btn ghost" type="button">Back</button>
        </div>
      </div>

      <div id="screen-settings" class="overlay hidden">
        <div class="panel">
          <h2 class="panel-title">Settings</h2>
          <div class="setting-row">
            <span>Background music</span>
            <button id="set-music" class="pixel-btn small" type="button">On</button>
          </div>
          <label class="setting-row slider">
            <span>Music volume</span>
            <span class="slider-line"><input id="vol-music" type="range" min="0" max="100" step="5"><output id="out-music">50</output></span>
          </label>
          <div class="setting-row">
            <span>Sound effects</span>
            <button id="set-sfx" class="pixel-btn small" type="button">On</button>
          </div>
          <label class="setting-row slider">
            <span>Effects volume</span>
            <span class="slider-line"><input id="vol-sfx" type="range" min="0" max="100" step="5"><output id="out-sfx">70</output></span>
          </label>
          <button id="btn-settings-back" class="pixel-btn ghost" type="button">Back</button>
        </div>
      </div>

      <div id="screen-pause" class="overlay hidden">
        <div class="panel">
          <h2 class="panel-title">Paused</h2>
          <p class="final">Score <strong id="pause-score">0</strong></p>
          <div class="menu-list">
            <button id="btn-resume" class="pixel-btn" type="button">Resume</button>
            <button id="btn-pause-settings" class="pixel-btn ghost" type="button">Settings</button>
            <button id="btn-quit" class="pixel-btn ghost" type="button">Main menu</button>
          </div>
        </div>
      </div>

      <div id="screen-over" class="overlay hidden">
        <div class="panel">
          <h2 id="over-title" class="panel-title">Game Over</h2>
          <p class="final">Final score <strong id="final-score">0</strong></p>
          <p class="final">Best <strong id="final-best">0</strong></p>
          <div class="menu-list">
            <button id="btn-restart" class="pixel-btn" type="button">Restart</button>
            <button id="btn-over-menu" class="pixel-btn ghost" type="button">Main menu</button>
          </div>
        </div>
      </div>
    </div>

    <div id="dpad" class="dpad idle" aria-label="Directional controls">
      <span></span>
      <button class="dpad-btn" type="button" data-dir="up" aria-label="Up">&#9650;</button>
      <span></span>
      <button class="dpad-btn" type="button" data-dir="left" aria-label="Left">&#9664;</button>
      <span></span>
      <button class="dpad-btn" type="button" data-dir="right" aria-label="Right">&#9654;</button>
      <span></span>
      <button class="dpad-btn" type="button" data-dir="down" aria-label="Down">&#9660;</button>
      <span></span>
    </div>
    <p class="help">Arrows or WASD to steer. Swipe on the board on mobile.</p>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
